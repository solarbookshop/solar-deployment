apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-ui
  labels:
    app: solar-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-ui
  template:
    metadata:
      labels:
        app: solar-ui
    spec:
      containers:
        - name: solar-ui
#          image: ghcr.io/solarbookshop/solar-ui
          image: solar-ui:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 9004
          env:
            - name: PORT
              value: "9004"

---

apiVersion: v1
kind: Service
metadata:
  name: solar-ui
  labels:
    app: solar-ui
spec:
  type: ClusterIP
  selector:
    app: solar-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9004