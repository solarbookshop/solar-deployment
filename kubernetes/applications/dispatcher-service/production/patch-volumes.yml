apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-service
spec:
  template:
    spec:
      containers:
        - name: dispatcher-service
          volumeMounts:
            - name: dispatcher-config-volume
              mountPath: /workspace/config
            - name: rabbitmq-credentials-volume
              mountPath: /workspace/secrets/rabbitmq
      volumes:
        - name: dispatcher-config-volume
          configMap:
            name: dispatcher-config
        - name: rabbitmq-credentials-volume
          secret:
            secretName: solar-rabbitmq-credentials
