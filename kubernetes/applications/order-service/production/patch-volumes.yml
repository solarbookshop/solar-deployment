apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  template:
    spec:
      containers:
        - name: order-service
          volumeMounts:
            - name: order-config-volume
              mountPath: /workspace/config
            - name: postgres-credentials-volume
              mountPath: /workspace/secrets/postgres
            - name: rabbitmq-credentials-volume
              mountPath: /workspace/secrets/rabbitmq
            - name: keycloak-credentials-volume
              mountPath: /workspace/secrets/keycloak
      volumes:
        - name: order-config-volume
          configMap:
            name: order-config
        - name: postgres-credentials-volume
          secret:
            secretName: solar-postgres-order-credentials
        - name: rabbitmq-credentials-volume
          secret:
            secretName: solar-rabbitmq-credentials
        - name: keycloak-credentials-volume
          secret:
            secretName: keycloak-issuer-resourceserver-secret
